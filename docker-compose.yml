version: '3.8'

services:
  # NCN Backend API
  ncn-web:
    build:
      context: ./ncn-web
      dockerfile: Dockerfile
    container_name: ncn-web
    restart: unless-stopped
    ports:
      - "7000:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-1433}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - LDAP_URL=${LDAP_URL}
      - LDAP_BASE_DN=${LDAP_BASE_DN}
      - LDAP_BIND_DN=${LDAP_BIND_DN}
      - LDAP_BIND_CREDENTIALS=${LDAP_BIND_CREDENTIALS}
      - LDAP_SEARCH_FILTER=${LDAP_SEARCH_FILTER}
      - SESSION_SECRET=${SESSION_SECRET}
      # ⚠️ 必须配置：不设时后端会回落到代码里硬编码的公开默认值
      #（ncn-web/src/config/index.ts: 'ncn-jwt-secret-change-in-production'），
      # 任何人都可伪造任意用户（含 Admin）的登录 Cookie，绕过 LDAP 直接进系统。
      # 生成：openssl rand -hex 32
      - JWT_SECRET=${JWT_SECRET}
      - NCN_ADMIN_LAN_IDS=${NCN_ADMIN_LAN_IDS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - NCN_APP_URL=${NCN_APP_URL}
      - UPLOAD_PATH=/app/uploads
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen-plus}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-30000}
      - CSI_TENANT=${CSI_TENANT:-NAIGROUP_PRD}
      - CSI_AUTH_BASIC=${CSI_AUTH_BASIC}
      - CSI_USERNAME=${CSI_USERNAME}
      - CSI_PASSWORD=${CSI_PASSWORD}
      - CSI_TIMEOUT_MS=${CSI_TIMEOUT_MS:-20000}
      - TZ=Asia/Shanghai
    volumes:
      # 宿主机附件目录：服务器为 CIFS 共享挂载 /mnt/taskmanager（.env 配 UPLOAD_HOST_PATH=/mnt/taskmanager），本地开发默认 ./uploads
      - ${UPLOAD_HOST_PATH:-./uploads}:/app/uploads
    networks:
      - public-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  public-net:
    external: true
